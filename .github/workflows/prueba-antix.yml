# Prueba automatica: descarga antiX 26.1 Core real (32 y 64 bits), abre su
# sistema de archivos en una carpeta (chroot) y alli:
#   1. retira los inits que no son runit, como lo hace el script, y
#      comprueba que runit sigue siendo el init y que no se borro nada mas;
#   2. instala de verdad los paquetes de cada escritorio (LXDE, LXQt,
#      Fluxbox) y muestra cuanto espacio ocupan.
#   3. en antiX Full de 32 bits, la limpieza que deja IceWM (--limpiar),
#      sin red.
# No arranca el escritorio: eso se revisa a mano en una maquina virtual.
name: Prueba en antiX 32 y 64 bits

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ANTIX_VERSION: "26.1"

jobs:
  revisar-script:
    name: Revisar el script (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n antix-desktop-postinstall.sh
      - run: shellcheck -S warning antix-desktop-postinstall.sh

  antix:
    name: antiX ${{ matrix.arch }} + ${{ matrix.escritorio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ["386", "x64"]
        escritorio: [lxde, lxqt, fluxbox]
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools p7zip-full

      - name: Guardar la ISO entre pruebas
        uses: actions/cache@v4
        with:
          path: iso
          key: antix-${{ env.ANTIX_VERSION }}-${{ matrix.arch }}-core

      - name: Descargar antiX ${{ env.ANTIX_VERSION }} Core ${{ matrix.arch }}
        run: |
          mkdir -p iso
          f="antiX-${ANTIX_VERSION}_${{ matrix.arch }}-core.iso"
          if [ ! -s "iso/$f" ]; then
            for intento in 1 2 3 4; do
              curl -fsSL --retry 3 -o "iso/$f" \
                "https://sourceforge.net/projects/antix-linux/files/Final/antiX-${ANTIX_VERSION}/$f/download" && break
              sleep $((intento * 20))
            done
          fi
          ls -la iso

      - name: Abrir el sistema de antiX
        run: |
          f="iso/antiX-${ANTIX_VERSION}_${{ matrix.arch }}-core.iso"
          7z e -y -o"$RUNNER_TEMP" "$f" antiX/linuxfs >/dev/null
          sudo unsquashfs -q -d /antix "$RUNNER_TEMP/linuxfs"
          sudo cp /etc/resolv.conf /antix/etc/resolv.conf
          for d in proc sys dev dev/pts; do sudo mount --bind /$d /antix/$d; done
          # En un chroot no se arrancan servicios.
          printf '#!/bin/sh\nexit 101\n' | sudo tee /antix/usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /antix/usr/sbin/policy-rc.d
          sudo cp antix-desktop-postinstall.sh /antix/root/
          sudo chroot /antix cat /etc/antix-version
          sudo chroot /antix dpkg --print-architecture
          sudo chroot /antix apt-get update -q

      - name: Elegir los espejos mas rapidos
        run: |
          inicio=$(date +%s)
          sudo chroot /antix env ANTIX_SOLO_FUNCIONES=1 bash -c '. /root/antix-desktop-postinstall.sh; LOG_FILE=/tmp/espejos.log; choose_fast_mirrors'
          echo "Tardo $(( $(date +%s) - inicio )) s."
          echo "--- Fuentes de apt despues:"; sudo chroot /antix sh -c 'grep -h "^deb " /etc/apt/sources.list.d/*.list'
          echo "--- Registro:"; sudo cat /antix/tmp/espejos.log
          test -f /antix/etc/apt/apt.conf.d/80antix-desktop-reintentos || { echo "::error::Falta la configuracion de reintentos"; exit 1; }
          test -d /antix/var/backups/antix-desktop-espejos/original || { echo "::error::Falta la copia original de las fuentes"; exit 1; }
          sudo chroot /antix grep -q "security.debian.org" /etc/apt/sources.list.d/debian.list || { echo "::error::Se perdio security.debian.org"; exit 1; }
          # Los paquetes de los pasos siguientes se bajan de los espejos elegidos.
          sudo chroot /antix apt-get update -q 2>&1 | tee update.log
          if grep -qE '^(E:|Err:)' update.log; then echo "::error::apt-get update fallo con los espejos elegidos"; exit 1; fi
          { echo "### Espejos (antiX ${{ matrix.arch }})"; sudo grep -E '\[(OK|WARN)\]' /antix/tmp/espejos.log | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Servicios de runit que ofrece antiX (informativo)
        run: |
          sudo chroot /antix apt-cache search --names-only '^runit-service-' | sort
          sudo chroot /antix apt-cache show cups bluez | grep -E '^(Package|Version|Depends|Recommends|Suggests):'

      - name: Retirar los otros inits (solo queda runit)
        run: |
          regex="$(bash antix-desktop-postinstall.sh --listar inits)"
          pkgs="$(sudo chroot /antix dpkg-query -W -f='${Package} ${Status}\n' | awk '$NF=="installed"{print $1}' | grep -E "$regex")"
          echo "Paquetes de inits a retirar: $(echo $pkgs)"
          extra="$(sudo chroot /antix apt-get -s purge $pkgs | awk '/^(Remv|Purg) /{print $2}' | sed 's/:.*//' | grep -vE "$regex" || true)"
          if [ -n "$extra" ]; then echo "::error::Se borraria tambien: $extra"; exit 1; fi
          sudo chroot /antix env DEBIAN_FRONTEND=noninteractive apt-get purge -y $pkgs
          echo "--- /sbin/init apunta a:"; sudo chroot /antix readlink -f /sbin/init
          test "$(sudo chroot /antix readlink -f /sbin/init)" = "$(sudo chroot /antix readlink -f /lib/runit/runit-init)"
          # Las entradas de GRUB salen de los inits que existen (10_linux).
          quedan=""
          for p in /lib/sysvinit/init /lib/s6-rc/s6-rc-init /lib/s6-66/s6-66-init /lib/dinit/dinit; do
            [ -x "/antix$p" ] && quedan="$quedan $p"
          done
          if [ -n "$quedan" ]; then echo "::error::Siguen otros inits:$quedan"; exit 1; fi
          for p in runit-init-antix runit-antix initscripts sysv-rc init init-diversity-tools grub-init-diversity; do
            sudo chroot /antix dpkg-query -W -f='${Package} ${Status}\n' "$p" | grep -q 'ok installed' || { echo "::error::Se perdio $p"; exit 1; }
          done
          echo "OK: solo queda runit."

      - name: Instalar ${{ matrix.escritorio }} y los programas de uso general
        run: |
          pk="$(bash antix-desktop-postinstall.sh --listar ${{ matrix.escritorio }})"
          antes="$(sudo du -sm /antix --exclude=/antix/proc --exclude=/antix/sys --exclude=/antix/dev | cut -f1)"
          sudo chroot /antix env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $pk 2>&1 | tee instalar.log
          sudo chroot /antix apt-get clean
          despues="$(sudo du -sm /antix --exclude=/antix/proc --exclude=/antix/sys --exclude=/antix/dev | cut -f1)"
          falta=""
          for p in $pk; do
            sudo chroot /antix dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'ok installed' || falta="$falta $p"
          done
          nuevos="$(grep -c '^Setting up ' instalar.log || true)"
          {
            echo "### antiX ${{ matrix.arch }} + ${{ matrix.escritorio }}"
            echo "- Paquetes nuevos: $nuevos"
            echo "- Espacio en disco: $antes MB antes, $despues MB despues (+$((despues - antes)) MB)"
            echo "- Sin instalar: ${falta:-ninguno}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$falta" ]; then echo "::error::No se instalaron:$falta"; exit 1; fi
          sudo chroot /antix dpkg -l | grep -E '^ii +(elogind|libpam-elogind|sddm|systemd) ' && { echo "::error::Se instalo algo que no debia"; exit 1; } || true
          for f in "/usr/share/xsessions/$( case ${{ matrix.escritorio }} in lxde) echo LXDE;; lxqt) echo lxqt;; fluxbox) echo fluxbox;; esac ).desktop" /usr/sbin/lightdm /usr/sbin/NetworkManager /usr/bin/firefox-esr /usr/bin/atril /usr/sbin/cupsd /usr/bin/mpv /usr/bin/blueman-applet; do
            test -e "/antix$f" || { echo "::error::Falta $f"; exit 1; }
          done
          # Servicio de LightDM (el script lo instala al final).
          sudo chroot /antix env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends runit-service-lightdm
          echo "--- Servicios en /etc/sv:"; ls /antix/etc/sv
          echo "--- Servicios activados:"; ls -la /antix/etc/runit/runsvdir/default/
          for c in "network-manager NetworkManager" cups "bluetooth bluetoothd" lightdm consolekit; do
            hay=""; for n in $c; do [ -x "/antix/etc/sv/$n/run" ] && hay="$hay $n"; done
            echo "Servicio [$c]:${hay:- NINGUNO}"
          done
          echo "OK"

      - name: YouTube ligero (yt-dlp, QuickJS-NG y gtk-pipe-viewer)
        run: |
          echo "Huella de pipe-viewer: $(curl -fsSL https://codeload.github.com/trizen/pipe-viewer/tar.gz/refs/tags/$(grep '^PV_VERSION=' antix-desktop-postinstall.sh | cut -d'"' -f2) | sha256sum | cut -d' ' -f1)"
          sudo chroot /antix env ANTIX_SOLO_FUNCIONES=1 bash -c '. /root/antix-desktop-postinstall.sh; LOG_FILE=/tmp/youtube.log; TARGET_HOME=""; TARGET_USER=""; setup_youtube' || true
          sudo tail -n 40 /antix/tmp/youtube.log || true
          for f in /usr/local/bin/yt-dlp /usr/local/bin/qjs /usr/local/bin/gtk-pipe-viewer /usr/local/bin/pipe-viewer /etc/yt-dlp.conf /etc/mpv/mpv.conf /usr/local/share/applications/antix-youtube.desktop; do
            test -e "/antix$f" || { echo "::error::Falta $f"; exit 1; }
          done
          sudo chroot /antix /usr/local/bin/qjs -e 'print("QuickJS funciona")'
          sudo chroot /antix /usr/local/bin/yt-dlp --version
          sudo chroot /antix /usr/local/bin/yt-dlp -v --simulate 2>&1 | grep -iE 'JS runtimes|python|exe versions' || true
          sudo chroot /antix /usr/local/bin/yt-dlp -v --simulate 2>&1 | grep -iE 'JS runtimes:.*quickjs' || { echo "::error::yt-dlp no ve QuickJS"; exit 1; }
          sudo chroot /antix perl -MWWW::PipeViewer -e 'print "pipe-viewer $WWW::PipeViewer::VERSION\n"'
          sudo chroot /antix perl -MGtk3 -e 'print "Gtk3 para Perl OK\n"'
          echo "OK"

      - name: Apariencia de Fluxbox (barra tint2 y tema oscuro)
        if: matrix.escritorio == 'fluxbox'
        run: |
          sudo chroot /antix env ANTIX_SOLO_FUNCIONES=1 bash -c '. /root/antix-desktop-postinstall.sh; LOG_FILE=/tmp/fluxbox.log; DESKTOP=FLUXBOX; TARGET_HOME=""; TARGET_USER=""; setup_desktop_config'
          for f in .fluxbox/startup .fluxbox/menu .fluxbox/init .fluxbox/overlay .config/tint2/tint2rc .config/gtk-3.0/settings.ini .gtkrc-2.0; do
            test -s "/antix/etc/skel/$f" || { echo "::error::Falta /etc/skel/$f"; exit 1; }
          done
          echo "--- init de Fluxbox:"; cat /antix/etc/skel/.fluxbox/init
          echo "--- Estilos de Fluxbox disponibles:"; ls /antix/usr/share/fluxbox/styles | tr '\n' ' '; echo
          for f in firefox-esr pcmanfm lxterminal; do
            test -e "/antix/usr/share/applications/$f.desktop" || { echo "::error::Falta el acceso $f.desktop de la barra"; exit 1; }
          done
          test -d /antix/usr/share/themes/Arc-Dark && test -d /antix/usr/share/icons/Papirus-Dark
          # tint2 de verdad, en una pantalla virtual: no debe quejarse de su configuracion.
          sudo chroot /antix apt-get install -y --no-install-recommends xvfb xauth >/dev/null
          sudo chroot /antix bash -c 'Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 & sleep 2; DISPLAY=:99 timeout 5 tint2 -c /etc/skel/.config/tint2/tint2rc >/tmp/tint2.log 2>&1; rc=$?; pkill Xvfb; echo "tint2 termino con $rc (124 = seguia funcionando)"; [ $rc = 124 ]'
          sudo grep -iE "unknown|invalid|error|warning" /antix/tmp/tint2.log || echo "tint2 no reporto problemas en su configuracion"
          echo "OK"

  # antiX Full de 32 bits: la limpieza que deja IceWM (--limpiar). Corre
  # SIN red (unshare -n) para demostrar que no descarga nada, con el
  # sistema en espanol (es_CO), como lo instalaria una persona en Colombia.
  antix-full:
    name: antiX Full 386 + limpieza (IceWM, sin internet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools p7zip-full

      - name: Guardar la ISO entre pruebas
        uses: actions/cache@v4
        with:
          path: iso
          key: antix-${{ env.ANTIX_VERSION }}-386-full

      - name: Descargar antiX ${{ env.ANTIX_VERSION }} Full 386
        run: |
          mkdir -p iso
          f="antiX-${ANTIX_VERSION}_386-full.iso"
          if [ ! -s "iso/$f" ]; then
            for intento in 1 2 3 4; do
              curl -fsSL --retry 3 -o "iso/$f" \
                "https://sourceforge.net/projects/antix-linux/files/Final/antiX-${ANTIX_VERSION}/$f/download" && break
              sleep $((intento * 20))
            done
          fi
          ls -la iso

      - name: Abrir el sistema de antiX Full
        run: |
          7z e -y -o"$RUNNER_TEMP" "iso/antiX-${ANTIX_VERSION}_386-full.iso" antiX/linuxfs >/dev/null
          sudo unsquashfs -q -d /antix "$RUNNER_TEMP/linuxfs"
          rm -f "$RUNNER_TEMP/linuxfs"
          for d in proc sys dev dev/pts; do sudo mount --bind /$d /antix/$d; done
          printf '#!/bin/sh\nexit 101\n' | sudo tee /antix/usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /antix/usr/sbin/policy-rc.d
          sudo cp antix-desktop-postinstall.sh /antix/root/
          # Sistema instalado en espanol de Colombia.
          echo 'LANG=es_CO.UTF-8' | sudo tee /antix/etc/default/locale
          sudo chroot /antix dpkg-query -W -f='${Package} ${Status}\n' | awk '$NF=="installed"{print $1}' | sort > antes.txt
          echo "Paquetes antes: $(wc -l < antes.txt)"

      - name: Limpiar (sin red)
        run: |
          inicio=$(date +%s)
          sudo unshare -n chroot /antix env ANTIX_SOLO_FUNCIONES=1 bash -c \
            '. /root/antix-desktop-postinstall.sh; LOG_FILE=/tmp/limpiar.log; remove_other_inits; clean_antix_full'
          echo "Tardo $(( ($(date +%s) - inicio) / 60 )) min."
          echo "--- Registro:"; sudo cat /antix/tmp/limpiar.log | grep -E '^\S+ \S+ \[' || true

      - name: Comprobar lo que quedo
        run: |
          sudo chroot /antix dpkg-query -W -f='${Package} ${Status}\n' | awk '$NF=="installed"{print $1}' | sort > despues.txt
          error=0
          for p in icewm desktop-defaults-icewm-antix desktop-session-antix zzzfm rox-filer roxterm-gtk2 \
                   firefox-esr firefox-esr-l10n-es-es libreoffice-writer libreoffice-calc libreoffice-impress \
                   libreoffice-l10n-es hunspell-es evince celluloid mpv xmms mirage leafpad transmission-gtk \
                   xfburn control-centre-antix connman cmst ceni slimski cups simple-scan blueman synaptic \
                   gparted packageinstaller antix-memory-manager runit-init-antix locales \
                   firmware-iwlwifi firmware-atheros firmware-realtek firmware-misc-nonfree; do
            if ! grep -qx "$p" despues.txt; then echo "::error::Se perdio $p"; error=1; fi
          done
          for p in fluxbox jwm herbstluftwm claws-mail hexchat geany dosbox antix-installer locales-all \
                   firefox-esr-l10n-de libreoffice-l10n-fr firmware-netronome gcc; do
            if grep -qx "$p" despues.txt; then echo "::error::Sigue instalado $p"; error=1; fi
          done
          if ! sudo chroot /antix locale -a | grep -qi '^es_CO.utf-\?8$'; then echo "::error::No quedo el idioma es_CO"; error=1; fi
          sudo chroot /antix dpkg --audit && echo "dpkg --audit: sin problemas"
          sudo chroot /antix apt-get check -q || error=1
          rotos="$(sudo chroot /antix sh -c 'for f in /usr/share/applications/*.desktop; do [ -e "$f" ] || echo "$f"; done')"
          if [ -n "$rotos" ]; then echo "::error::Accesos del menu rotos: $rotos"; error=1; fi
          ls /antix/usr/share/xsessions
          if ls /antix/usr/share/xsessions | grep -qiE 'fluxbox|jwm|herbstluft'; then echo "::error::Quedan sesiones de otros escritorios"; error=1; fi
          sudo chroot /antix firefox-esr --version || error=1
          sudo chroot /antix sh -c 'command -v antix-viewer && command -v icewm'
          quitados="$(comm -23 antes.txt despues.txt | wc -l)"
          {
            echo "### antiX Full 386: limpieza con IceWM (sin internet)"
            echo "- Paquetes: $(wc -l < antes.txt) antes, $(wc -l < despues.txt) despues ($quitados retirados)."
            sudo grep -E '\[(OK|WARN)\]' /antix/tmp/limpiar.log | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- Retirados:"; comm -23 antes.txt despues.txt | tr '\n' ' '; echo
          exit $error
